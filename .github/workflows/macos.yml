name: Macbygge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera beroenden
        run: npm ci
      - name: Installera Canvas för båda Mac-arkitekturerna
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const lock = require('./package-lock.json')
          const packages = ['x64', 'arm64'].map(arch => {
            const name = `@napi-rs/canvas-darwin-${arch}`
            return `${name}@${lock.packages[`node_modules/${name}`].version}`
          })
          // npm otherwise installs only the runner's native architecture.
          execFileSync('npm', ['install', '--no-save', '--package-lock=false', '--force', ...packages], { stdio: 'inherit' })
          NODE
      - name: Sätt byggdatum
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.buildDate = new Date().toISOString().slice(0, 10)
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
      - name: Testa
        run: npm test
      - name: Kontrollera JavaScript
        run: npm run lint
      - name: Bygg för Intel och Apple Silicon
        run: npm run make:mac
      - name: Kontrollera appens arkitekturer och signatur
        run: |
          APP="out/mac-universal/Sjömätning.app"
          lipo "$APP/Contents/MacOS/Sjömätning" -verify_arch x86_64 arm64
          CANVAS="$APP/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs"
          lipo "$CANVAS/canvas-darwin-x64/skia.darwin-x64.node" -verify_arch x86_64
          lipo "$CANVAS/canvas-darwin-arm64/skia.darwin-arm64.node" -verify_arch arm64
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Spara byggartefakter
        uses: actions/upload-artifact@v4
        with:
          name: Sjomatning-macOS-universal-${{ github.run_number }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/*.dmg
            out/*.zip
