name: Windowsbygge

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera beroenden
        run: npm ci
      - name: Kontrollera versionsetikett
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Taggen $env:GITHUB_REF_NAME matchar inte package.json v$packageVersion"
          }
      - name: Testa
        run: npm test
      - name: Kontrollera JavaScript
        run: npm run lint
      - name: Bygg Windows-installation
        run: npm run make
      - name: Spara byggartefakter
        uses: actions/upload-artifact@v4
        with:
          name: Sjomatning-Windows-${{ github.sha }}
          path: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
      - name: Publicera versionsbygge
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
