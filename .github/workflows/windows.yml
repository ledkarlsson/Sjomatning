name: Windows- och Macbygge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build-date: ${{ steps.metadata.outputs.build-date }}
    steps:
      - name: Bestäm gemensam version och byggdatum
        id: metadata
        run: |
          echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "build-date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
  build-macos:
    needs: prepare
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build-date: ${{ needs.prepare.outputs.build-date }}
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera beroenden
        run: npm ci
      - name: Sätt unik byggversion
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          npm version $version --no-git-tag-version
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.buildDate = "${{ needs.prepare.outputs.build-date }}"
          $package | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
      - name: Testa
        run: npm test
      - name: Kontrollera JavaScript
        run: npm run lint
      - name: Bygg Windows-installation
        run: npm run make
      - name: Spara byggartefakter
        uses: actions/upload-artifact@v4
        with:
          name: Sjomatning-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
  release:
    needs: [prepare, build-windows, build-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hämta båda plattformarnas filer
        uses: actions/download-artifact@v4
        with:
          pattern: Sjomatning-*
          merge-multiple: true
          path: release
      - name: Publicera gemensamt versionsbygge
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sjömätning ${{ needs.prepare.outputs.version }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.dmg
            release/*.zip
