name: Windowsbygge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4
      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installera beroenden
        run: npm ci
      - name: Sätt unik byggversion
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = "0.2.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $package | ConvertTo-Json -Depth 20 | Set-Content package.json -Encoding utf8
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
      - name: Testa
        run: npm test
      - name: Kontrollera JavaScript
        run: npm run lint
      - name: Bygg Windows-installation
        run: npm run make
      - name: Spara byggartefakter
        uses: actions/upload-artifact@v4
        with:
          name: Sjomatning-Windows-${{ github.sha }}
          path: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
      - name: Publicera versionsbygge
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: Sjömätning ${{ env.BUILD_VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
